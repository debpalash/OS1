[package]
name = "indos-orchestrator"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["IndOS Contributors"]
description = "IndOS orchestrator — intent classification, agent routing, session management"

[dependencies]
# Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IPC
tokio-util = { version = "0.7", features = ["codec"] }

# Internal crates
indos-privacy = { path = "../indos-privacy" }
indos-security = { path = "../indos-security" }
indos-context-engine = { path = "../indos-context-engine" }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
toml = "0.8"
dirs = "5"
