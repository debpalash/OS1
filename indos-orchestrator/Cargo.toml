[package]
name = "indos-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "IndOS orchestrator — intent classification, agent routing, Ollama conversation"

[dependencies]
# Runtime
tokio = { workspace = true, features = ["fs", "net", "io-util", "process", "sync", "time"] }

# HTTP client for Ollama API
reqwest = { workspace = true, features = ["stream"] }
futures-util = "0.3"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Internal crates
indos-privacy = { path = "../indos-privacy" }
indos-security = { path = "../indos-security" }
indos-context-engine = { path = "../indos-context-engine" }

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Utils
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
toml.workspace = true
dirs.workspace = true
libc.workspace = true
