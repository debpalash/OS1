[package]
name = "indos-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "IndOS voice I/O pipeline — local STT (Faster-Whisper) + TTS (Piper) + PipeWire"

[[bin]]
name = "indos-voiced"
path = "src/main.rs"

[[example]]
name = "tts_smoke"
path = "examples/tts_smoke.rs"

[dependencies]
# Audio I/O via PipeWire subprocesses (pw-record / pw-play)

# Async runtime
tokio = { workspace = true, features = ["net", "io-util", "process", "signal", "time"] }

# IPC
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Config
toml.workspace = true
dirs.workspace = true
anyhow.workspace = true
libc.workspace = true
