[package]
name = "indos-voice"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["IndOS Contributors"]
description = "IndOS voice I/O pipeline — local STT (Faster-Whisper) + TTS (Piper) + PipeWire"

[dependencies]
# Audio
cpal = "0.15"                    # Cross-platform audio I/O

# IPC
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# STT/TTS subprocess management
tokio-process = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
toml = "0.8"
dirs = "5"
anyhow = "1"
