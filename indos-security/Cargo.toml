[package]
name = "indos-security"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["IndOS Contributors"]
description = "IndOS security layer — agent sandboxing, capability model, and audit logging"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
anyhow = "1"
toml = "0.8"
dirs = "5"
