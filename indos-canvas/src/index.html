<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IndOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <!-- Custom Titlebar -->
    <header id="titlebar" data-tauri-drag-region>
      <div class="titlebar-left" data-tauri-drag-region>
        <div class="titlebar-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="url(#grad1)" stroke-width="2"/>
            <circle cx="12" cy="12" r="4" fill="url(#grad1)"/>
            <defs>
              <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#a78bfa"/>
                <stop offset="100%" style="stop-color:#06b6d4"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="titlebar-title">IndOS</span>
        </div>
        <div id="status-indicator" class="status-dot offline" title="Checking..."></div>
      </div>
      <div class="titlebar-center" data-tauri-drag-region>
        <span id="active-model" class="model-badge">initializing...</span>
      </div>
      <div class="titlebar-right">
        <button id="btn-new-thread" class="titlebar-btn" title="New conversation">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="btn-sidebar-toggle" class="titlebar-btn" title="Toggle sidebar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
        <div class="window-controls">
          <button id="btn-minimize" class="win-ctrl minimize" title="Minimize">
            <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <button id="btn-maximize" class="win-ctrl maximize" title="Maximize">
            <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
          </button>
          <button id="btn-close" class="win-ctrl close" title="Close">
            <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.5"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div id="app-layout">
      <!-- Sidebar: Thread List -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <h3>Conversations</h3>
        </div>
        <div id="thread-list" class="thread-list">
          <!-- Populated by JS -->
        </div>
        <div class="sidebar-footer">
          <div id="system-info-mini" class="system-mini"></div>
        </div>
      </aside>

      <!-- Main Canvas -->
      <main id="canvas" class="canvas">
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="welcome">
          <div class="welcome-content">
            <div class="welcome-logo">
              <svg width="80" height="80" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="url(#grad2)" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="6" stroke="url(#grad2)" stroke-width="1" opacity="0.6"/>
                <circle cx="12" cy="12" r="2.5" fill="url(#grad2)"/>
                <defs>
                  <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#a78bfa"/>
                    <stop offset="50%" style="stop-color:#818cf8"/>
                    <stop offset="100%" style="stop-color:#06b6d4"/>
                  </linearGradient>
                </defs>
              </svg>
            </div>
            <h1 class="welcome-title">Welcome to <span class="gradient-text">IndOS</span></h1>
            <p class="welcome-subtitle">Your AI-first operating system. The conversation IS the desktop.</p>
            <div class="welcome-suggestions">
              <button class="suggestion-chip" data-prompt="Show me my system information">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                System Info
              </button>
              <button class="suggestion-chip" data-prompt="Show me the files in my home directory">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                Browse Files
              </button>
              <button class="suggestion-chip" data-prompt="What can you help me with?">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Help
              </button>
              <button class="suggestion-chip" data-prompt="What models do I have available locally?">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                AI Models
              </button>
            </div>
          </div>
        </div>

        <!-- Conversation Messages -->
        <div id="messages-container" class="messages-container hidden">
          <div id="messages" class="messages">
            <!-- Messages populated by JS -->
          </div>
        </div>

        <!-- Input Area -->
        <div id="input-area" class="input-area">
          <div class="input-wrapper">
            <div class="input-row">
              <textarea
                id="message-input"
                placeholder="Talk to your computer..."
                rows="1"
                autofocus
              ></textarea>
              <button id="send-btn" class="send-btn" title="Send message">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="22" y1="2" x2="11" y2="13"/>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
            <div class="input-footer">
              <span class="input-hint">Enter to send · Shift+Enter for new line</span>
              <div class="input-actions">
                <select id="model-select" class="model-select" title="Select model">
                  <option value="llama3.2">Loading models...</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
