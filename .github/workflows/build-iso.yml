name: Build IndOS ISO

# The full ISO build is expensive (privileged archiso container, pacstrap, rust
# release builds). It runs on pushes to main and on-demand — NOT on every PR.
# Fast correctness checks for PRs live in ci.yml.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          # `findmnt` is provided by util-linux, not a standalone package
          # (pacman errors with "target not found: findmnt" otherwise).
          # protobuf/cmake/clang: compile the workspace's lancedb stack
          # (lance-encoding needs `protoc`).
          # wayland/libxkbcommon/mesa/...: compile indos-shell (iced/Wayland),
          # which build-iso.sh builds alongside the workspace binaries.
          # (Same dep sets as the rust + gui jobs in ci.yml.)
          pacman -S --noconfirm archiso base-devel rust cargo util-linux git \
            protobuf cmake clang \
            wayland wayland-protocols libxkbcommon mesa vulkan-icd-loader \
            fontconfig freetype2

      # Cache the cargo registry and the workspace + shell target dirs. Without
      # this the uncached release build of the lancedb/lance/datafusion tree
      # takes ~47 min on a 2-core runner; the cache makes reruns incremental.
      - name: Cache cargo + target dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            indos-shell/target
          key: iso-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'indos-shell/Cargo.lock') }}
          restore-keys: iso-cargo-${{ runner.os }}-

      - name: Build ISO
        run: |
          # We are running as root inside the archlinux container
          # Set skip cargo flag to 0 so we actually build the rust binaries
          export INDOS_SKIP_CARGO=0
          bash autotest/build.sh --clean

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: indos-iso
          path: build/out/*.iso
          retention-days: 7
