[package]
name = "indos-context-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["IndOS Contributors"]
description = "IndOS context engine — LanceDB vector memory + embeddings + temporal patterns"

[dependencies]
# Vector database
lancedb = "0.15"

# Embeddings (will call local model via Ollama)
reqwest = { version = "0.12", features = ["json"] }

# Core
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time/temporal
chrono = { version = "0.4", features = ["serde"] }

# Storage
dirs = "5"
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
anyhow = "1"
