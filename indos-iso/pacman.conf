# IndOS ISO — pacman.conf (CachyOS base)
# CachyOS repos FIRST for optimized packages (x86-64-v3 compiled)
# Then standard Arch repos as fallback

[options]
Architecture = auto
SigLevel = Required DatabaseOptional
ParallelDownloads = 10

# CachyOS v3 repos (x86-64-v3 optimized — AVX2+, most modern CPUs)
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

# CachyOS generic repo
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# Standard Arch repos (fallback)
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
