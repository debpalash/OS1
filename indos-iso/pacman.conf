# IndOS ISO Builder — archiso profile
# pacman.conf for the live environment

[options]
Architecture = auto
SigLevel = Required DatabaseOptional
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
