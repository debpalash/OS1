LABEL indos
TEXT HELP
Boot OS 1 (CachyOS kernel, BIOS).
Your computer, as a conversation.
ENDTEXT
MENU LABEL OS 1 Generative Desktop (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G console=tty0 console=ttyS0,115200

LABEL indos-lts
TEXT HELP
Boot OS 1 with LTS kernel (fallback).
ENDTEXT
MENU LABEL OS 1 LTS Kernel (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G console=tty0 console=ttyS0,115200
