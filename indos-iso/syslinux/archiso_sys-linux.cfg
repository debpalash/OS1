LABEL indos
TEXT HELP
Boot IndOS Generative Desktop (CachyOS kernel, BIOS).
AI-first, local-first Linux distribution.
ENDTEXT
MENU LABEL IndOS Generative Desktop (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL indos-lts
TEXT HELP
Boot IndOS with LTS kernel (fallback).
ENDTEXT
MENU LABEL IndOS LTS Kernel (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
