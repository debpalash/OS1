# IndOS — User creation settings (with test defaults pre-filled)
---
defaultGroups:
    - name: wheel
      must_exist: true
      system: true
    - name: video
      must_exist: false
      system: true
    - name: audio
      must_exist: false
      system: true
    - name: input
      must_exist: false
      system: true
    - name: network
      must_exist: false
      system: true

autologinGroup: autologin

sudoersGroup: wheel

setRootPassword: true

doAutologin: false

# Pre-filled defaults for faster testing
presets:
    fullName:
        value: "User"
        editable: true
    loginName:
        value: "user"
        editable: true
    hostName:
        value: "os1"
        editable: true

passwordRequirements:
    minLength: 1
    maxLength: -1

allowWeakPasswords: true
allowWeakPasswordsDefault: true

# Default shell for new users
userShell: /bin/zsh
