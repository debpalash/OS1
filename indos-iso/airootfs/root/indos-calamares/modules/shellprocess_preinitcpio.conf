#
# IndOS — Pre-initcpio repair (runs in chroot BEFORE initcpiocfg/initcpio)
# Logic lives in /usr/local/bin/indos-preinitcpio-repair (copied into the
# target by unpackfs); inline shell variables here would be misparsed by
# Calamares as its own substitution variables.
---
dontChroot: false

timeout: 120

script:
    - command: "/usr/local/bin/indos-preinitcpio-repair"
