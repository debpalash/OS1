#
# IndOS — Post-install shell process
# Runs inside chroot on the installed system after all modules
---
dontChroot: false

script:
    # Remove live-session artifacts from installed system
    - command: "rm -f /etc/calamares/settings.conf"
    - command: "rm -rf /etc/calamares"

    # Remove archiso hooks from installed system
    - command: "rm -f /etc/mkinitcpio.conf.d/archiso.conf"

    # Remove live user's desktop installer shortcut
    - command: "rm -f /etc/skel/.config/autostart/calamares.desktop"
    - command: "rm -f /etc/skel/Desktop/calamares.desktop"

    # Set IndOS branding on installed system
    - command: "-cp /etc/os-release /etc/os-release.bak"
    - command: |
        cat > /etc/os-release << 'OSEOF'
        NAME="IndOS"
        PRETTY_NAME="IndOS Generative Desktop"
        ID=indos
        ID_LIKE=arch cachyos
        BUILD_ID=rolling
        VARIANT="Generative Desktop"
        VARIANT_ID=desktop
        HOME_URL="https://github.com/user/IndOS"
        DOCUMENTATION_URL="https://github.com/user/IndOS/wiki"
        LOGO=indos-logo
        OSEOF

    # Set hostname
    - command: "echo 'indos' > /etc/hostname"

    # Enable IndOS user services for all new users via global preset
    - command: "mkdir -p /etc/systemd/user/default.target.wants"
    - command: "-ln -sf /etc/systemd/user/indos-orchestrator.service /etc/systemd/user/default.target.wants/indos-orchestrator.service"
    - command: "-ln -sf /etc/systemd/user/ollama-user.service /etc/systemd/user/default.target.wants/ollama-user.service"

    # Switch greetd from live-ISO auto-login to proper tuigreet login
    - command: |
        cat > /etc/greetd/config.toml << 'GREETEOF'
        [terminal]
        vt = 1

        [default_session]
        command = "tuigreet --remember --time --greeting 'Welcome to IndOS' --sessions /usr/share/wayland-sessions"
        user = "greeter"
        GREETEOF

    # Rebuild initramfs for installed kernel (removes archiso hooks)
    - command: "mkinitcpio -P"
      timeout: 120
