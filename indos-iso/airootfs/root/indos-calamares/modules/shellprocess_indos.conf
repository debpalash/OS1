#
# IndOS — Post-install shell process
# Runs inside chroot on the installed system after all modules
---
dontChroot: false

script:
    # Remove live-session artifacts from installed system
    - command: "rm -f /etc/calamares/settings.conf"
    - command: "rm -rf /etc/calamares"

    # Remove archiso hooks from installed system
    - command: "rm -f /etc/mkinitcpio.conf.d/archiso.conf"

    # Remove live user's desktop installer shortcut — both from skel AND
    # from homes already created from skel by the users module
    - command: "rm -f /etc/skel/.config/autostart/calamares.desktop"
    - command: "rm -f /etc/skel/Desktop/calamares.desktop"
    - command: "sh -c 'rm -f /home/*/.config/autostart/calamares.desktop /home/*/Desktop/calamares.desktop'"

    # The installer is spawned by niri's config.kdl on the live ISO —
    # strip that line everywhere on the installed system
    - command: "sh -c 'sed -i /calamares/d /etc/skel/.config/niri/config.kdl /home/*/.config/niri/config.kdl /usr/share/indos/settings/niri/config.kdl 2>/dev/null || true'"

    # Set OS 1 branding on installed system
    - command: "-cp /etc/os-release /etc/os-release.bak"
    - command: |
        cat > /etc/os-release << 'OSEOF'
        NAME="OS 1"
        PRETTY_NAME="OS 1"
        ID=os1
        ID_LIKE=arch cachyos
        BUILD_ID=rolling
        VARIANT="Generative Desktop"
        VARIANT_ID=desktop
        HOME_URL="https://github.com/user/IndOS"
        DOCUMENTATION_URL="https://github.com/user/IndOS/wiki"
        LOGO=os1-logo
        OSEOF

    # Set hostname
    - command: "echo 'os1' > /etc/hostname"

    # Enable OS 1 user services for all new users via global preset
    - command: "mkdir -p /etc/systemd/user/default.target.wants"
    - command: "-ln -sf /etc/systemd/user/indos-orchestrator.service /etc/systemd/user/default.target.wants/indos-orchestrator.service"
    - command: "-ln -sf /etc/systemd/user/ollama-user.service /etc/systemd/user/default.target.wants/ollama-user.service"

    # Switch greetd from live-ISO auto-login to proper tuigreet login
    - command: |
        cat > /etc/greetd/config.toml << 'GREETEOF'
        [terminal]
        vt = 1

        [default_session]
        command = "tuigreet --remember --time --greeting 'Welcome back.' --sessions /usr/share/wayland-sessions"
        user = "greeter"
        GREETEOF

    # OS 1 boot splash on the installed system: the archiso.conf removed
    # above carried the plymouth hook, so re-add it with standard
    # installed-system hooks, and put quiet+splash on the GRUB cmdline
    - command: |
        cat > /etc/mkinitcpio.conf.d/plymouth.conf << 'PLYEOF'
        HOOKS=(base udev plymouth autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)
        PLYEOF
    - command: "-sed -i 's/^GRUB_CMDLINE_LINUX_DEFAULT=\"\\([^\"]*\\)\"/GRUB_CMDLINE_LINUX_DEFAULT=\"\\1 quiet splash\"/' /etc/default/grub"
    - command: "-grub-mkconfig -o /boot/grub/grub.cfg"
      timeout: 60

    # Rebuild initramfs for installed kernel (removes archiso hooks,
    # embeds the os1 plymouth theme)
    - command: "mkinitcpio -P"
      timeout: 120
