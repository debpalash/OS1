#
# IndOS — Welcome page configuration
---
# Show "Install IndOS" or "Try IndOS"
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false

# Requirements for installation
# Lower storage requirement and make root check non-blocking
# (Calamares is launched via sudo but the check can be flaky in live ISOs)
requirements:
    requiredStorage: 8.0
    requiredRam: 1.0
    internetCheckUrl: ""
    check:
        - storage
        - ram
    required:
        - ram

# No GeoIP (offline installer)
geoip:
    style: "none"

# Language selection on welcome page
languageIcon: ""
