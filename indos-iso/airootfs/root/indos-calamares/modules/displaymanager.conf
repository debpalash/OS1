# IndOS — Display Manager configuration
# greetd with tuigreet — no SDDM/GDM/LightDM
---
displaymanagers:
    - greetd

# Required: set_autologin dereferences this even with autologin off —
# a missing entry crashes the module with 'NoneType has no executable'
defaultDesktopEnvironment:
    executable: "/usr/local/bin/indos-session"
    desktopFile: "indos-niri"

# greetd config is already placed by customize_airootfs.sh
# No executable check needed — greetd is always installed
basicSetup: false
