# Autologin root on the serial console — used by the autonomous test
# harness (autotest/) to run in-guest health checks over QEMU's serial
# socket without typing credentials. Harmless on real hardware (no ttyS0
# console= arg means this unit never starts).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud 115200,57600,38400,9600 %I $TERM
